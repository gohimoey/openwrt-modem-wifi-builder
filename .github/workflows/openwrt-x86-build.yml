name: Build OpenWrt x86_64

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'full-modem-wifi'
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev git-core unzip zlib1g-dev libssl-dev gawk perl-package-dev

      - name: Create build directory
        run: |
          mkdir -p ~/openwrt-build
          cd ~/openwrt-build

      - name: Download OpenWrt SDK
        run: |
          cd ~/openwrt-build
          wget -q https://downloads.openwrt.org/releases/23.05.4/targets/x86/64/openwrt-sdk-23.05.4-x86-64_gcc-13.2.0_musl-linux-x86_64.tar.xz
          tar -xf openwrt-sdk-23.05.4-x86-64_gcc-13.2.0_musl-linux-x86_64.tar.xz

      - name: Configure OpenWrt build
        run: |
          cd ~/openwrt-build/openwrt-sdk-23.05.4-x86-64_gcc-13.2.0_musl-linux-x86_64
          make defconfig
          # Add target
          sed -i 's/CONFIG_TARGET_x86=y/CONFIG_TARGET_x86_64=y/' .config
          sed -i 's/CONFIG_TARGET_BOARD="x86"/CONFIG_TARGET_BOARD="x86_64"/' .config

      - name: Install required packages
        run: |
          cd ~/openwrt-build/openwrt-sdk-23.05.4-x86-64_gcc-13.2.0_musl-linux-x86_64
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Build image with all packages
        run: |
          cd ~/openwrt-build/openwrt-sdk-23.05.4-x86-64_gcc-13.2.0_musl-linux-x86_64
          echo "CONFIG_PACKAGES+=" >> .config
          PACKAGES="kmod-ath11k kmod-iwlwifi kmod-mt7921e kmod-usb-net-qmi-wwan kmod-usb-serial-option qmi-utils uqmi modemmanager luci luci-app-mwan3 kmod-usb-core kmod-usb2 kmod-usb3 kmod-usb-net"
          echo "$PACKAGES" | tr ' ' '\n' | while read pkg; do
            echo "CONFIG_PACKAGE_$pkg=y" >> .config
          done
          make V=s 2>&1 | tee build.log

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-image
          path: |
            ~/openwrt-build/openwrt-sdk-23.05.4-x86-64_gcc-13.2.0_musl-linux-x86_64/bin/targets/x86/64/
          if-no-files-found: warn

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: ~/openwrt-build/openwrt-sdk-23.05.4-x86-64_gcc-13.2.0_musl-linux-x86_64/bin/targets/x86/64/*.img.gz
          name: OpenWrt x86_64 - Full Modem + WiFi Support
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}