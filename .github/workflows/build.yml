name: Build OpenWrt 25.12 Masta GOHIM

on:
  push:
    branches: [ master ]
  tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make binutils findutils gawk unzip wget zstd

      - name: Download ImageBuilder
        run: |
          cd /tmp
          wget -q "https://dl.openwrt.ai/releases/25.12/targets/x86/64/kwrt-imagebuilder-x86-64.Linux-x86_64.tar.zst"
          tar --zstd -xf kwrt-imagebuilder-x86-64.Linux-x86_64.tar.zst

      - name: Configure hostname and feeds
        run: |
          cd /tmp/kwrt-imagebuilder-x86-64.Linux-x86_64
          echo 'CONFIG_HOST_NAME="Masta-GOHIM"' >> .config
          echo 'src/gz kiddin9 https://dl.openwrt.ai/releases/25.12/packages/x86_64/kiddin9' >> repositories.conf

      - name: Build OpenWrt image
        run: |
          cd /tmp/kwrt-imagebuilder-x86-64.Linux-x86_64
          PACKAGES="ttyd luci luci-app-mwan3 luci-app-wireguard luci-app-openvpn luci-app-sqm \
            luci-app-nlbwmon luci-app-opkg luci-app-commands luci-app-ttyd luci-theme-bootstrap \
            modemmanager qmi-utils uqmi usbutils usb-modeswitch \
            luci-app-passwall luci-app-openclash luci-app-filebrowser-go luci-proto-ncm luci-proto-qmi \
            kmod-usb-core kmod-usb-ohci kmod-usb-ehci kmod-usb-xhci \
            kmod-usb-net-qmi-wwan kmod-usb-net-cdc-mbim kmod-usb-net-cdc-ncm kmod-usb-serial-option"
          make image PROFILE=generic PACKAGES="$PACKAGES" 2>&1 | tail -50

      - name: Find output
        run: |
          cd /tmp/kwrt-imagebuilder-x86-64.Linux-x86_64
          find bin/targets/x86/64 -name "*.img*" -o -name "*.manifest" -o -name "*.gz" | head -20
          ls -la bin/targets/x86/64/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-masta-gohim
          path: /tmp/kwrt-imagebuilder-x86-64.Linux-x86_64/bin/targets/x86/64/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/kwrt-imagebuilder-x86-64.Linux-x86_64/bin/targets/x86/64/*
          name: OpenWrt 25.12 - Masta GOHIM All-in-One
          body: |
            ## Hostname: Masta-GOHIM
            
            Built-in: ttyd, luci, passwall, openclash, filebrowser, mwan3, wireguard, openvpn, sqm, modemmanager, qmi-utils
            
            Flash & use immediately! No post-install required for core features.