name: OpenWrt x86_64 UEFI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev git-core unzip zlib1g-dev gawk libssl-dev

      - name: Download ImageBuilder
        run: |
          cd /tmp
          wget -q https://downloads.openwrt.org/releases/23.05.4/targets/x86/64/openwrt-imagebuilder-23.05.4-x86-64.Linux-x86_64.tar.xz
          tar -xf openwrt-imagebuilder-23.05.4-x86-64.Linux-x86_64.tar.xz

      - name: Configure hostname
        run: |
          cd /tmp/openwrt-imagebuilder-23.05.4-x86-64.Linux-x86_64
          # Add hostname to image config
          echo 'CONFIG_HOST_NAME="Masta-GOHIM"' >> .config

      - name: Build OpenWrt image
        run: |
          cd /tmp/openwrt-imagebuilder-23.05.4-x86-64.Linux-x86_64

          PACKAGES="ttyd luci luci-app-mwan3 luci-app-wireguard luci-app-openvpn \
            luci-app-sqm luci-app-nlbwmon luci-app-opkg luci-app-statistics luci-mod-status \
            luci-theme-bootstrap luci-proto-ncm luci-proto-qmi \
            kmod-ath11k kmod-iwlwifi kmod-mt7915e kmod-mt7921e kmod-brcmfmac \
            kmod-usb-net-qmi-wwan kmod-usb-net-cdc-mbim kmod-usb-net-cdc-ncm \
            kmod-usb-serial-option kmod-usb-serial-wwan modemmanager qmi-utils uqmi \
            luci-app-commands kmod-sched-core kmod-ipt-nat-extra"

          echo "Building with packages: $PACKAGES"
          make image PROFILE=generic PACKAGES="$PACKAGES" V=s 2>&1 | tail -80

      - name: Verify output
        run: |
          cd /tmp/openwrt-imagebuilder-23.05.4-x86-64.Linux-x86_64
          ls -la bin/targets/x86/64/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-image
          path: /tmp/openwrt-imagebuilder-23.05.4-x86-64.Linux-x86_64/bin/targets/x86/64/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/openwrt-imagebuilder-23.05.4-x86-64.Linux-x86_64/bin/targets/x86/64/*
          name: OpenWrt x86_64 - Masta GOHIM Edition
          body: |
            ## 🏷️ Hostname: **Masta-GOHIM**
            
            ### 📦 Built-in Tools
            - ✅ ttyd - Web terminal
            - ✅ modemmanager, qmi-utils, uqmi - 4G/5G modem support
            - ✅ WiFi drivers: ath11k, iwlwifi, mt79xx
            - ✅ LuCI: mwan3, wireguard, openvpn, sqm, nlbwmon
            - ✅ luci-app-commands - CLI tools in web UI
            
            ### 📥 Post-install: Install Passwall + OpenClash
            ```bash
            # Add passwall feed
            echo "src/gz passwall http://op.supes.fun/packages" >> /etc/opkg/customfeeds.conf
            opkg update
            opkg install luci-app-passwall
            
            # Add openclash feed  
            echo "src/gz openclash https://github.com/vergesZhu/packages/releases/download/v1.0/oci86" >> /etc/opkg/customfeeds.conf
            opkg update
            opkg install luci-app-openclash
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}