name: Build OpenWrt x86_64 UEFI Builder

on:
  push:
    branches: [ master ]
  tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev git-core unzip \
            zlib1g-dev gawk libssl-dev

      - name: Download ImageBuilder
        run: |
          cd /tmp
          wget -q https://downloads.openwrt.org/releases/23.05.4/targets/x86/64/openwrt-imagebuilder-23.05.4-x86-64.Linux-x86_64.tar.xz
          tar -xf openwrt-imagebuilder-23.05.4-x86-64.Linux-x86_64.tar.xz

      - name: Build OpenWrt image
        run: |
          cd /tmp/openwrt-imagebuilder-23.05.4-x86-64.Linux-x86_64

          # Packages - verified available for x86_64:
          # WiFi drivers
          PACKAGES="kmod-ath11k kmod-ath10k-ct kmod-iwlwifi \
            kmod-mt7915e kmod-mt7921e kmod-mt7921u \
            kmod-brcmfmac kmod-rtl8xxxu \
            # Modem/4G/5G drivers
            kmod-usb-net-qmi-wwan kmod-usb-net-cdc-mbim \
            kmod-usb-net-cdc-ncm kmod-usb-net-huawei-cdc-ncm \
            kmod-usb-net-sierrawireless kmod-usb-serial-option \
            kmod-usb-serial-wwan kmod-mhi-wwan-ctrl \
            # Core USB + serial
            kmod-usb-core kmod-usb2 kmod-usb3 kmod-usb-net kmod-usb-xhci-hcd \
            # Modem tools
            qmi-utils uqmi modemmanager comgt luci \
            # Network tools
            luci-app-mwan3 luci-app-wireguard luci-app-openvpn \
            luci-app-sqm luci-app-nlbwmon luci-app-opkg"

          echo "🔨 Building OpenWrt x86_64 with modem+WiFi packages..."
          make image PROFILE=generic PACKAGES="$PACKAGES" V=s 2>&1 | tail -80

      - name: Verify output
        run: |
          cd /tmp/openwrt-imagebuilder-23.05.4-x86-64.Linux-x86_64
          echo "=== Output images ==="
          ls -la bin/targets/x86/64/ 2>/dev/null || echo "No images"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64-images
          path: /tmp/openwrt-imagebuilder-23.05.4-x86-64.Linux-x86_64/bin/targets/x86/64/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/openwrt-imagebuilder-23.05.4-x86-64.Linux-x86_64/bin/targets/x86/64/*
          name: OpenWrt x86_64 - Modem + WiFi Builder
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}