name: OpenWrt Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write  # penting untuk release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y make gawk unzip wget zstd

      - name: Download ImageBuilder (kwrt 25.12)
        run: |
          cd /tmp
          wget -q "https://dl.openwrt.ai/releases/25.12/targets/x86/64/kwrt-imagebuilder-x86-64.Linux-x86_64.tar.zst"
          tar --zstd -xf kwrt-imagebuilder-x86-64.Linux-x86_64.tar.zst

      - name: Configure hostname + Kiddin9 feed
        run: |
          cd /tmp/kwrt-imagebuilder-x86-64.Linux-x86_64
          echo 'CONFIG_HOST_NAME="Masta-GOHIM"' >> .config
          echo 'src/gz kiddin9 https://dl.openwrt.ai/releases/25.12/packages/x86_64/kiddin9' >> repositories.conf

      - name: Build Image
        run: |
          cd /tmp/kwrt-imagebuilder-x86-64.Linux-x86_64
          PACKAGES="luci luci-app-mwan3 luci-app-wireguard luci-app-openvpn luci-app-sqm \
            luci-app-nlbwmon luci-app-opkg luci-app-ttyd \
            modemmanager qmi-utils usbutils usb-modeswitch \
            luci-app-passwall luci-app-openclash luci-app-filebrowser-go luci-proto-ncm"
          make image PROFILE=generic PACKAGES="$PACKAGES" 2>&1 | tail -30

      - name: Verify image output
        run: |
          cd /tmp/kwrt-imagebuilder-x86-64.Linux-x86_64
          echo "=== Image files ==="
          find bin/targets -name "*.img*" -type f
          echo "=== File sizes ==="
          ls -lh bin/targets/x86/64/*.img.gz 2>/dev/null || echo "Image not found"

      - name: Copy to output
        run: |
          cd /tmp/kwrt-imagebuilder-x86-64.Linux-x86_64
          mkdir -p /tmp/output
          cp bin/targets/x86/64/*.img.gz /tmp/output/ 2>/dev/null || find bin -name "*.img*" -exec cp {} /tmp/output/ \;

      - name: Create Release (with file upload)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: masta-gohim-25.12
          name: OpenWrt 25.12 - Masta GOHIM All-in-One
          body: |
            ## Hostname: Masta-GOHIM
            
            ### ✅ Built-in Tools
            - luci-app-ttyd (web terminal)
            - luci-app-passwall (proxy)
            - luci-app-openclash (proxy)  
            - luci-app-filebrowser-go (file manager)
            - mwan3, wireguard, openvpn, sqm, nlbwmon
            - modemmanager, qmi-utils (4G/5G)
            - WiFi drivers compiled-in
            
            ### 🚀 Flash
            1. Download firmware
            2. gunzip firmware.img.gz
            3. dd if=firmware.img of=/dev/sdX bs=4M
          files: /tmp/output/*.img.gz
          fail_on_tag_exists: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-masta-gohim
          path: bin/targets/x86/64/*.img.gz
          retention-days: 7