name: OpenWrt Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make gawk unzip wget zstd

      - name: Download ImageBuilder
        run: |
          cd /tmp
          wget -q "https://dl.openwrt.ai/releases/25.12/targets/x86/64/kwrt-imagebuilder-x86-64.Linux-x86_64.tar.zst"
          tar --zstd -xf kwrt-imagebuilder-x86-64.Linux-x86_64.tar.zst

      - name: Configure
        run: |
          cd /tmp/kwrt-imagebuilder-x86-64.Linux-x86_64
          echo 'CONFIG_HOST_NAME="Masta-GOHIM"' >> .config
          echo 'src/gz kiddin9 https://dl.openwrt.ai/releases/25.12/packages/x86_64/kiddin9' >> repositories.conf

      - name: Build image
        run: |
          cd /tmp/kwrt-imagebuilder-x86-64.Linux-x86_64
          PACKAGES="ttyd luci luci-app-mwan3 luci-app-wireguard luci-app-openvpn luci-app-sqm \
            luci-app-nlbwmon luci-app-opkg luci-app-ttyd \
            modemmanager qmi-utils usbutils usb-modeswitch \
            luci-app-passwall luci-app-openclash luci-app-filebrowser-go luci-proto-ncm"
          make image PROFILE=generic PACKAGES="$PACKAGES" 2>&1 | tail -50

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-masta-gohim
          path: /tmp/kwrt-imagebuilder-x86-64.Linux-x86_64/bin/targets/x86/64/generic*.img*
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.0
          name: OpenWrt 25.12 - Masta GOHIM All-in-One
          body: |
            ## 🏷️ Hostname: Masta-GOHIM
            
            ### 📦 All-in-One Features
            - ✅ ttyd - Web terminal
            - ✅ luci-app-passwall + openclash - Proxy tools  
            - ✅ luci-app-filebrowser-go - Web file manager
            - ✅ mwan3, wireguard, openvpn, sqm, nlbwmon
            - ✅ modemmanager, qmi-utils - 4G/5G modem support
            - ✅ WiFi drivers compiled-in
            
            Single flash, immediate use!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}